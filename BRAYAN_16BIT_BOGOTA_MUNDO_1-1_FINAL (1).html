<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>BRAYAN 16 BIT — Mundo 1-1: Carrera 7ª (Bogotá)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0c0a18;
    --gold: #facc15;
    --red: #dc2626;
    --blue: #2563eb;
    --cyan: #38bdf8;
    --text: #f8fafc;
    --pixel-font: 'Press Start 2P', 'Courier New', monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
    background: var(--bg-dark); color: var(--text); font-family: var(--pixel-font);
    touch-action: manipulation;
  }
  #app {
    position: relative; width: 100%; height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: radial-gradient(circle at 50% 35%, #1d1536 0%, #090714 100%);
  }

  /* ===== TOP BAR ===== */
  .topbar {
    position: relative; z-index: 40; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 7px 12px; background: rgba(9, 7, 20, 0.94); border-bottom: 3px solid #33295c; flex-shrink: 0;
  }
  .brand-mini { display: flex; align-items: center; gap: 8px; font-size: clamp(9px, 2vw, 12px); color: var(--gold); text-shadow: 2px 2px 0 #000; white-space: nowrap; }
  .brand-badge { background: linear-gradient(180deg, #facc15 0%, #eab308 100%); color: #111; padding: 3px 6px; font-size: clamp(7px, 1.5vw, 9px); border: 2px solid #000; box-shadow: 2px 2px 0 #000; text-shadow: none; }
  .topbar-controls { display: flex; align-items: center; gap: 6px; }
  .flag-btn, .sfx-btn {
    display: inline-flex; align-items: center; gap: 5px; background: #1b1736; color: #fff;
    border: 2px solid #4c417a; padding: 5px 8px; font-family: var(--pixel-font);
    font-size: clamp(8px, 1.7vw, 10px); cursor: pointer; box-shadow: 2px 2px 0 #000;
  }
  .flag-btn:active, .sfx-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
  .flag-btn.active { border-color: var(--gold); background: #2f2559; box-shadow: 0 0 10px rgba(250, 204, 21, 0.35), 2px 2px 0 #000; }
  .sfx-btn.muted { opacity: 0.65; border-color: #64748b; }
  .flag-svg { width: 18px; height: 12px; display: block; image-rendering: pixelated; border: 1px solid #000; }

  /* ===== MAIN STAGE ===== */
  .stage-wrap {
    position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; overflow: hidden; padding: 6px;
  }

  /* ===== TITLE SCREEN ===== */
  #screen-title {
    position: relative; width: 100%; max-width: 960px; height: 100%; max-height: 600px;
    border: 4px solid #3f356e; box-shadow: 0 16px 50px rgba(0,0,0,0.75), inset 0 0 0 2px #000;
    overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; background: #0d0a1c;
  }
  .title-bg-layer {
    position: absolute; inset: -20px; background-size: cover; background-position: center;
    filter: brightness(0.45) saturate(1.15); animation: slowPan 18s ease-in-out infinite alternate; z-index: 0;
  }
  @keyframes slowPan { 0% { transform: scale(1.06) translateX(-10px); } 100% { transform: scale(1.1) translateX(10px); } }
  .title-scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 2px, transparent 2px, transparent 4px);
  }
  .title-content {
    position: relative; z-index: 2; width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: space-evenly; padding: clamp(10px, 2.2vh, 22px) clamp(12px, 3vw, 28px);
    text-align: center; overflow-y: auto;
  }
  .hero-header { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 2.5vw, 22px); flex-wrap: wrap; }
  .title-sprite-preview { height: clamp(74px, 15vh, 126px); width: auto; image-rendering: pixelated; filter: drop-shadow(0 6px 0 rgba(0,0,0,0.65)); animation: heroBob 1.8s ease-in-out infinite; }
  .title-sprite-flip { transform: scaleX(-1); animation: heroBobFlip 1.8s ease-in-out infinite; }
  @keyframes heroBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes heroBobFlip { 0%, 100% { transform: scaleX(-1) translateY(0); } 50% { transform: scaleX(-1) translateY(-5px); } }
  .title-logo-box { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .game-title {
    margin: 0; font-size: clamp(22px, 5vw, 44px); line-height: 1.15; color: var(--gold);
    text-shadow: 0 4px 0 #b45309, 0 7px 0 #000, 3px 0 0 #000, -3px 0 0 #000, 0 -3px 0 #000;
  }
  .game-subtitle {
    display: inline-block; padding: 3px; box-shadow: 3px 3px 0 #000;
    background: linear-gradient(90deg, #facc15 0%, #facc15 50%, #2563eb 50%, #2563eb 75%, #dc2626 75%, #dc2626 100%);
  }
  .game-subtitle span { display: block; background: #120d26; color: #fff; padding: 5px 12px; font-size: clamp(8px, 1.6vw, 11px); letter-spacing: 1px; }

  .mode-section { width: 100%; max-width: 740px; }
  .mode-prompt { font-size: clamp(9px, 1.8vw, 12px); color: #e2e8f0; margin: 0 0 10px 0; text-shadow: 2px 2px 0 #000; }
  .mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(8px, 2vw, 16px); }
  .mode-card {
    position: relative; background: rgba(15, 13, 33, 0.92); border: 3px solid #4c417a;
    padding: clamp(10px, 2vh, 16px) clamp(8px, 1.8vw, 14px); text-align: left; cursor: pointer;
    box-shadow: 4px 4px 0 #000; font-family: var(--pixel-font); color: #fff;
  }
  .mode-card.selected { border-color: var(--gold); background: rgba(37, 27, 74, 0.96); box-shadow: 0 0 18px rgba(250, 204, 21, 0.35), 4px 4px 0 #000; transform: translateY(-2px); }
  .mode-card.selected::before { content: "▶"; position: absolute; top: 10px; right: 10px; color: var(--gold); font-size: 12px; animation: blinkArrow 0.8s steps(2) infinite; }
  @keyframes blinkArrow { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .mode-tag { display: inline-block; font-size: clamp(7px, 1.4vw, 9px); padding: 3px 6px; margin-bottom: 8px; border: 2px solid #000; }
  .mode-tag.light { background: #22c55e; color: #052e16; }
  .mode-tag.heavy { background: #ef4444; color: #fff; }
  .mode-name { font-size: clamp(10px, 2.2vw, 14px); color: var(--gold); margin: 0 0 8px 0; text-shadow: 2px 2px 0 #000; }
  .mode-desc { font-size: clamp(7px, 1.45vw, 9px); line-height: 1.65; color: #cbd5e1; margin: 0; }

  .play-cta-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .btn-play {
    background: linear-gradient(180deg, #fde047 0%, #eab308 100%); color: #111; border: 3px solid #000;
    box-shadow: 0 5px 0 #854d0e, 0 8px 20px rgba(0,0,0,0.6); padding: clamp(11px, 2vh, 15px) clamp(24px, 5vw, 44px);
    font-family: var(--pixel-font); font-size: clamp(12px, 2.4vw, 17px); cursor: pointer; letter-spacing: 1px;
  }
  .btn-play:active { transform: translateY(4px); box-shadow: 0 1px 0 #854d0e; }
  .controls-hint { font-size: clamp(7px, 1.4vw, 9px); color: #cbd5e1; text-shadow: 1px 1px 0 #000; line-height: 1.5; }

  /* ===== CUTSCENE & GAME CANVAS CONTAINER ===== */
  #screen-canvas-wrap {
    display: none; width: 100%; max-width: 980px; height: 100%;
    flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .canvas-frame {
    position: relative; width: 100%; max-width: 960px; aspect-ratio: 16 / 9;
    max-height: calc(100% - 108px); background: #000; border: 4px solid #4c417a;
    box-shadow: 0 14px 40px rgba(0,0,0,0.8); overflow: hidden;
  }
  #gameCanvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .btn-skip {
    position: absolute; top: 10px; right: 10px; z-index: 20;
    background: rgba(15, 13, 33, 0.92); color: #fff; border: 3px solid var(--gold);
    padding: 7px 12px; font-family: var(--pixel-font); font-size: clamp(9px, 1.8vw, 12px);
    cursor: pointer; box-shadow: 3px 3px 0 #000;
  }

  /* Overlay for Victory / Game Over / Pause */
  #game-overlay {
    display: none; position: absolute; inset: 0; z-index: 25;
    background: rgba(8, 6, 20, 0.84); flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; text-align: center; gap: 14px;
  }
  .overlay-box {
    background: linear-gradient(180deg, #1b163c 0%, #0e0b24 100%);
    border: 4px solid var(--gold); box-shadow: 0 10px 35px rgba(0,0,0,0.85), inset 0 0 0 3px #000;
    padding: clamp(14px, 3vw, 24px); max-width: 560px; width: 92%;
  }
  .overlay-title { font-size: clamp(15px, 3.2vw, 24px); color: var(--gold); margin: 0 0 10px 0; text-shadow: 3px 3px 0 #000; }
  .overlay-sub { font-size: clamp(8px, 1.6vw, 11px); color: #e2e8f0; line-height: 1.7; margin: 0 0 14px 0; }
  .overlay-stats {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px;
    background: rgba(0,0,0,0.45); padding: 10px; border: 2px solid #4c417a; font-size: clamp(7px, 1.4vw, 9px); text-align: left;
  }
  .overlay-btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

  /* SNES Dialogue Box */
  .dialogue-box {
    width: 100%; max-width: 960px; min-height: 88px;
    background: linear-gradient(180deg, #161333 0%, #0d0b21 100%); border: 4px solid #f59e0b;
    box-shadow: inset 0 0 0 3px #1e1b4b, 0 6px 20px rgba(0,0,0,0.75);
    padding: 9px 14px; display: flex; flex-direction: column; justify-content: space-between;
    cursor: pointer; flex-shrink: 0;
  }
  .dialogue-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .dialogue-speaker { font-size: clamp(8px, 1.6vw, 10px); color: var(--gold); text-shadow: 2px 2px 0 #000; }
  .dialogue-step { font-size: clamp(8px, 1.5vw, 10px); color: #94a3b8; }
  .dialogue-text { font-size: clamp(9px, 1.8vw, 12px); line-height: 1.6; color: #fff; text-shadow: 2px 2px 0 #000; min-height: 3.1em; }
  .dialogue-next { align-self: flex-end; font-size: clamp(7px, 1.4vw, 9px); color: var(--gold); animation: blinkArrow 0.75s steps(2) infinite; }

  /* World 1-1 Controls Bar (PC + Mobile) */
  #world1-controls {
    display: none; width: 100%; max-width: 960px; align-items: center; justify-content: space-between;
    gap: 8px; background: rgba(15, 13, 33, 0.94); border: 3px solid #4c417a; padding: 7px 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6); flex-shrink: 0;
  }
  .dpad-group { display: flex; align-items: center; gap: 8px; }
  .touch-btn {
    background: #251e4d; color: #fff; border: 3px solid #6355a8; padding: 10px 16px;
    font-family: var(--pixel-font); font-size: clamp(10px, 2vw, 13px); cursor: pointer;
    box-shadow: 2px 2px 0 #000; min-width: 52px; text-align: center; touch-action: none;
  }
  .touch-btn.jump-btn { background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%); color: #111; border-color: #000; min-width: 96px; }
  .touch-btn:active, .touch-btn.pressed { background: #38bdf8; color: #000; transform: translateY(2px); }
  .world1-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .btn-secondary {
    background: #1e293b; color: #f8fafc; border: 2px solid #94a3b8; padding: 7px 9px;
    font-family: var(--pixel-font); font-size: clamp(7px, 1.4vw, 9px); cursor: pointer; box-shadow: 2px 2px 0 #000;
  }
  .btn-secondary:active { transform: translate(1px, 1px); }

  #transition-curtain { position: fixed; inset: 0; background: #000; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }

  @media (max-width: 640px) {
    .mode-grid { grid-template-columns: 1fr; }
    .brand-badge { display: none; }
    .canvas-frame { max-height: 48dvh; }
    .dialogue-box { min-height: 112px; }
    .hide-mobile { display: none; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    .topbar { padding: 4px 10px; }
    .title-sprite-preview { height: 60px; }
    .mode-desc { display: none; }
    .canvas-frame { max-height: calc(100dvh - 122px); }
    .dialogue-box { min-height: 66px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand-mini">
      <span>BRAYAN 16 BIT</span>
      <span class="brand-badge">BOGOTÁ D.C.</span>
    </div>
    <div class="topbar-controls">
      <button id="btn-es" class="flag-btn active" aria-label="Español (Colombia)" title="Español (Colombia)">
        <svg class="flag-svg" viewBox="0 0 18 12" xmlns="http://www.w3.org/2000/svg">
          <rect width="18" height="6" y="0" fill="#FCD116"/><rect width="18" height="3" y="6" fill="#003893"/><rect width="18" height="3" y="9" fill="#CE1126"/>
        </svg><span>ES</span>
      </button>
      <button id="btn-en" class="flag-btn" aria-label="English (USA)" title="English (USA)">
        <svg class="flag-svg" viewBox="0 0 18 12" xmlns="http://www.w3.org/2000/svg">
          <rect width="18" height="12" fill="#FFF"/><rect width="18" height="2" y="0" fill="#B22234"/><rect width="18" height="2" y="4" fill="#B22234"/><rect width="18" height="2" y="8" fill="#B22234"/><rect width="18" height="1" y="11" fill="#B22234"/>
          <rect width="8" height="7" fill="#3C3B6E"/><rect width="1" height="1" x="1" y="1" fill="#FFF"/><rect width="1" height="1" x="4" y="1" fill="#FFF"/><rect width="1" height="1" x="6" y="1" fill="#FFF"/><rect width="1" height="1" x="2" y="3" fill="#FFF"/><rect width="1" height="1" x="5" y="3" fill="#FFF"/><rect width="1" height="1" x="1" y="5" fill="#FFF"/><rect width="1" height="1" x="4" y="5" fill="#FFF"/><rect width="1" height="1" x="6" y="5" fill="#FFF"/>
        </svg><span>EN</span>
      </button>
      <button id="btn-sfx" class="sfx-btn" aria-label="Sound">SFX: ON</button>
    </div>
  </header>

  <main class="stage-wrap">
    <!-- SCREEN 1: TITLE -->
    <section id="screen-title">
      <div id="title-bg" class="title-bg-layer"></div>
      <div class="title-scanlines"></div>
      <div class="title-content">
        <div class="hero-header">
          <img id="title-brayan-img" class="title-sprite-preview" alt="Brayan 16-bit" />
          <div class="title-logo-box">
            <h1 class="game-title">BRAYAN 16 BIT</h1>
            <div class="game-subtitle"><span id="t-subtitle">EDICIÓN BOGOTÁ • SÁTIRA 16-BIT</span></div>
          </div>
          <img id="title-nero-img" class="title-sprite-preview title-sprite-flip" alt="El Ñero 16-bit" />
        </div>
        <div class="mode-section">
          <p id="t-select-mode" class="mode-prompt">ELIGE TU MODO DE JUEGO:</p>
          <div class="mode-grid">
            <button id="card-light" class="mode-card selected" data-mode="light">
              <span id="t-light-tag" class="mode-tag light">DIFÍCIL</span>
              <h2 id="t-light-name" class="mode-name">MODO LIGERO</h2>
              <p id="t-light-desc" class="mode-desc">5 corazones. Chiclets de la chaza curan +2 ♥. Reto callejero bogotano.</p>
            </button>
            <button id="card-heavy" class="mode-card" data-mode="heavy">
              <span id="t-heavy-tag" class="mode-tag heavy">MUY DIFÍCIL</span>
              <h2 id="t-heavy-name" class="mode-name">MODO PESADO</h2>
              <p id="t-heavy-desc" class="mode-desc">3 corazones. Enemigos rápidos, chiclets solo +1 ♥. ¡Hora pico sin piedad!</p>
            </button>
          </div>
        </div>
        <div class="play-cta-wrap">
          <button id="btn-play" class="btn-play">▶ JUGAR</button>
          <div id="t-controls-hint" class="controls-hint">PC: ←/→ MODO • ENTER JUGAR • L IDIOMA • M SONIDO</div>
        </div>
      </div>
    </section>

    <!-- SCREEN 2 & 3: CUTSCENE + WORLD 1-1 -->
    <section id="screen-canvas-wrap">
      <div class="canvas-frame">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <button id="btn-skip" class="btn-skip">SKIP &gt;&gt;</button>
        <div id="game-overlay">
          <div class="overlay-box">
            <h2 id="ov-title" class="overlay-title">MUNDO 1-1 COMPLETADO</h2>
            <p id="ov-sub" class="overlay-sub"></p>
            <div id="ov-stats" class="overlay-stats"></div>
            <div class="overlay-btns">
              <button id="ov-btn-primary" class="btn-play" style="font-size:11px;padding:10px 18px;">↺ REINTENTAR</button>
              <button id="ov-btn-menu" class="btn-secondary" style="font-size:10px;padding:10px 14px;">⌂ MENÚ</button>
            </div>
          </div>
        </div>
      </div>

      <!-- SNES Dialogue Box (Cutscene) -->
      <div id="dialogue-box" class="dialogue-box" role="button" tabindex="0">
        <div class="dialogue-header">
          <span id="dlg-speaker" class="dialogue-speaker">NARRADOR • BOGOTÁ D.C.</span>
          <span id="dlg-step" class="dialogue-step">1 / 5</span>
        </div>
        <div id="dlg-text" class="dialogue-text"></div>
        <div id="dlg-next" class="dialogue-next">▼ TOCA O PULSA ESPACIO</div>
      </div>

      <!-- World 1-1 Action Bar (PC + Mobile) -->
      <div id="world1-controls">
        <div class="dpad-group">
          <button id="btn-left" class="touch-btn" aria-label="Izquierda">◀</button>
          <button id="btn-right" class="touch-btn" aria-label="Derecha">▶</button>
        </div>
        <div class="world1-actions">
          <button id="btn-pause" class="btn-secondary">❚❚ PAUSA</button>
          <button id="btn-replay-intro" class="btn-secondary hide-mobile">↺ INTRO</button>
          <button id="btn-back-menu" class="btn-secondary">⌂ MENÚ</button>
        </div>
        <div class="dpad-group">
          <button id="btn-jump" class="touch-btn jump-btn" aria-label="Saltar">SALTAR</button>
        </div>
      </div>
    </section>
  </main>
  <div id="transition-curtain"></div>
</div>

<script>
// =========================================================================

  function tone(freq, dur, type='square', vol=0.07, delay=0, slideTo=null) {
    const c = ensure(); if (!c) return;
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    gain.gain.setValueAtTime(vol, t0); gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.015);
  }
  function noise(dur, vol=0.04) {
    const c = ensure(); if (!c) return;
    const bufSize = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, bufSize, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const flt = c.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = 3200;
    const g = c.createGain(); g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    src.connect(flt); flt.connect(g); g.connect(c.destination);
    src.start();
  }
  return {
    toggle() { enabled = !enabled; if (enabled) this.blip(); return enabled; },
    blip() { tone(660, 0.055, 'square', 0.06); },
    select() { tone(520, 0.05, 'square', 0.06); tone(780, 0.08, 'square', 0.07, 0.05); },
    start() { tone(392,0.08,'square',0.08,0); tone(523,0.08,'square',0.08,0.08); tone(659,0.08,'square',0.08,0.16); tone(784,0.18,'square',0.09,0.24); },
    type() { tone(420 + Math.random()*140, 0.022, 'triangle', 0.03); },
    step() { tone(110, 0.035, 'triangle', 0.045, 0, 65); },
    jump() { tone(260, 0.14, 'square', 0.07, 0, 560); },
    stomp() { tone(320, 0.07, 'square', 0.09, 0, 120); tone(540, 0.09, 'triangle', 0.07, 0.06, 760); },
    collect() { tone(659, 0.06, 'square', 0.07, 0); tone(987, 0.11, 'square', 0.07, 0.06); },
    heal() { tone(523,0.07,'triangle',0.08,0); tone(659,0.07,'triangle',0.08,0.07); tone(784,0.07,'triangle',0.08,0.14); tone(1046,0.16,'triangle',0.09,0.21); },
    hurt() { tone(240, 0.16, 'sawtooth', 0.10, 0, 75); tone(160, 0.18, 'square', 0.08, 0.06, 55); },
    spray() { noise(0.11, 0.035); },
    throwSign() { tone(480, 0.09, 'triangle', 0.06, 0, 260); },
    snatch() { tone(340, 0.07, 'sawtooth', 0.08, 0, 600); tone(200, 0.12, 'square', 0.07, 0.07, 110); },
    crash() { tone(220,0.14,'sawtooth',0.11,0,55); tone(150,0.22,'square',0.09,0.04,40); tone(880,0.07,'triangle',0.06,0.18,620); },
    dream() { tone(330,0.35,'sine',0.07,0,440); tone(440,0.45,'sine',0.06,0.15,587); tone(523,0.60,'triangle',0.05,0.30,659); },
    victory() {
      [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, i===5?0.35:0.1, 'square', 0.08, i*0.11));
    },
    gameover() {
      [392, 349, 330, 262].forEach((f, i) => tone(f, i===3?0.42:0.16, 'sawtooth', 0.08, i*0.17));
    }
  };
})();

const IMGS = {};
let assetsLoaded = false;
function loadAllAssets() {
  const keys = Object.keys(ASSET_DATA);
  let loaded = 0;
  return new Promise((resolve) => {
    keys.forEach((k) => {
      const img = new Image();
      img.onload = img.onerror = () => {
        loaded++;
        if (loaded === keys.length) { assetsLoaded = true; resolve(); }
      };
      img.src = ASSET_DATA[k];
      IMGS[k] = img;
    });
  });
}

}

function setupBeat(idx) {
  const L = t();
  CUT.beat = idx; CUT.beatTime = 0; CUT.typedChars = 0; CUT.charAccum = 0;
  CUT.fullyTyped = false; CUT.autoAdvanceTimer = 0;
  const beatObj = L.beats[idx];
  elDlgSpeaker.textContent = L[beatObj.speakerKey];
  elDlgStep.textContent = `${idx + 1} / ${L.beats.length}`;
  elDlgText.textContent = '';

  if (idx === 3) {
    CUT.brayanState = 'trip'; CUT.tripProgress = 0; CUT.shakeTime = 0.45; CUT.flashAlpha = 0.65;
    if (!CUT.crashPlayed) { SFX.crash(); CUT.crashPlayed = true; }
    CUT.papers = [];
    for (let i = 0; i < 8; i++) {
      CUT.papers.push({
        x: CUT.brayanX + 55 + (Math.random() - 0.5) * 30, y: 340 + (Math.random() - 0.5) * 40,
        vx: 40 + Math.random() * 140, vy: -160 - Math.random() * 120,
        rot: Math.random() * 6.28, vrot: (Math.random() - 0.5) * 9, w: 14 + Math.random() * 6, h: 18 + Math.random() * 6
      });
    }
  } else if (idx === 4) {
    CUT.brayanState = 'ko';
    if (!CUT.dreamPlayed) { SFX.dream(); CUT.dreamPlayed = true; }
  }
}

function advanceCutscene() {
  if (STATE.screen !== 'INTRO_CUTSCENE') return;
  const L = t(), fullText = L.beats[CUT.beat].text;
  if (!CUT.fullyTyped) {
    CUT.typedChars = fullText.length; CUT.fullyTyped = true; elDlgText.textContent = fullText; SFX.blip(); return;
  }
  if (CUT.beat < L.beats.length - 1) { SFX.select(); setupBeat(CUT.beat + 1); }
  else enterWorld1_1();
}

function addFloatText(x, y, text, color='#facc15') {
  W1.floatTexts.push({ x, y, text, color, life: 1.25 });
}

function spawnParticles(x, y, color, count=8, spread=120) {
  for (let i = 0; i < count; i++) {
    W1.particles.push({
      x, y, vx: (Math.random() - 0.5) * spread, vy: -40 - Math.random() * spread * 0.9,
      size: 3 + Math.random() * 4, color, life: 0.45 + Math.random() * 0.35
    });
  }
}

function damagePlayer(sourceType='hit') {
  const P = W1.player;
  if (P.invuln > 0 || W1.status !== 'PLAYING') return;
  P.hp--;
  P.invuln = STATE.mode === 'heavy' ? 1.15 : 1.55;
  W1.shakeTime = 0.28;
  P.vy = -260;
  if (sourceType === 'nero') {
    SFX.snatch();
    const lost = Math.min(W1.score, STATE.mode === 'heavy' ? 200 : 100);
    W1.score -= lost;
    addFloatText(P.x + 20, P.y - 14, t().stolenTxt + (lost ? ` -${lost}` : ''), '#ef4444');
  } else {
    SFX.hurt();
    addFloatText(P.x + 20, P.y - 10, '-1 ♥', '#ef4444');
  }
  spawnParticles(P.x + P.w/2, P.y + P.h/2, '#ef4444', 10, 180);
  if (P.hp <= 0) {
    W1.status = 'GAMEOVER';
    SFX.gameover();
    showOverlay('GAMEOVER');
  }
}

function updateWorld1_1(dt) {
  if (W1.paused || W1.status !== 'PLAYING') return;
  const hard = (STATE.mode === 'heavy');
  W1.time += dt;
  if (W1.fadeIn > 0) W1.fadeIn = Math.max(0, W1.fadeIn - dt * 0.9);
  if (W1.shakeTime > 0) W1.shakeTime = Math.max(0, W1.shakeTime - dt);

  const P = W1.player;
  if (P.invuln > 0) P.invuln = Math.max(0, P.invuln - dt);

  // Horizontal movement
  const moveSpd = 265;
  P.vx = 0;
  if (W1.keys.left) { P.vx = -moveSpd; P.facing = -1; }
  if (W1.keys.right) { P.vx = moveSpd; P.facing = 1; }
  P.x = Math.max(20, Math.min(LEVEL_LEN - 80, P.x + P.vx * dt));

  if (P.vx !== 0 && P.onGround) {
    P.walkTimer += dt;
    if (P.walkTimer > 0.14) { P.walkTimer = 0; P.walkFrame = 1 - P.walkFrame; }
  }

  // Coyote time & jump buffer
  if (P.onGround) P.coyote = 0.12; else P.coyote = Math.max(0, P.coyote - dt);
  if (P.jumpBuffer > 0) P.jumpBuffer = Math.max(0, P.jumpBuffer - dt);

  if (P.jumpBuffer > 0 && P.coyote > 0) {
    P.vy = -610;
    P.onGround = false;
    P.coyote = 0;
    P.jumpBuffer = 0;
    SFX.jump();
    spawnParticles(P.x + P.w/2, P.y + P.h, '#e2e8f0', 5, 90);
  }

  // Variable jump height
  if (!W1.keys.jumpHeld && P.vy < -240) P.vy *= 0.85;

  // Gravity & one-way platform collisions
  const prevBottom = P.y + P.h;
  P.vy = Math.min(820, P.vy + 1480 * dt);
  P.y += P.vy * dt;
  P.onGround = false;

  if (P.vy >= 0) {
    for (const pl of W1.platforms) {
      if (P.x + P.w - 6 > pl.x && P.x + 6 < pl.x + pl.w) {
        if (prevBottom <= pl.y + 8 && P.y + P.h >= pl.y) {
          P.y = pl.y - P.h;
          P.vy = 0;
          P.onGround = true;
          break;
        }
      }
    }
  }
  if (P.y + P.h >= GROUND_Y) {
    P.y = GROUND_Y - P.h;
    P.vy = 0;
    P.onGround = true;
  }

  // Smooth camera follow
  const targetCam = Math.max(0, Math.min(LEVEL_LEN - 960, P.x - 320));
  W1.camX += (targetCam - W1.camX) * Math.min(1, dt * 8);

  // Background TransMilenio & Taxis
  W1.bgCars.forEach((c) => {
    c.x += c.speed * dt;
    if (c.x > LEVEL_LEN + 400) c.x = -350;
    if (c.x < -380) c.x = LEVEL_LEN + 350;
  });

  // Update Enemies
  for (const e of W1.enemies) {
    if (!e.alive) continue;
    e.animT += dt;
    const dist = (P.x + P.w/2) - (e.x + e.w/2);
    const absDist = Math.abs(dist);

    if (e.type === 'cartelera') {
      if (e.state === 'throw') {
        e.stateT -= dt;
        if (e.stateT <= 0) e.state = 'walk';
      } else {
        e.x += e.vx * dt;
        if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
        if (e.x > e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx); }
        e.facing = e.vx >= 0 ? 1 : -1;
        e.cd -= dt;
        if (e.cd <= 0 && absDist < 480) {
          e.facing = dist >= 0 ? 1 : -1;
          e.state = 'throw';
          e.stateT = 0.36;
          e.cd = hard ? 1.55 : 2.35;
          const pSpd = hard ? 275 : 205;
          W1.projectiles.push({
            x: e.x + e.w/2, y: e.y + 34,
            vx: e.facing * pSpd, vy: -95,
            rot: 0, motif: e.motif, life: 3.2
          });
          e.motif = (e.motif + 1) % 4;
          SFX.throwSign();
        }
      }
    } else if (e.type === 'grafitera') {
      if (e.state === 'walk') {
        e.x += e.vx * dt;
        if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
        if (e.x > e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx); }
        e.facing = e.vx >= 0 ? 1 : -1;
        e.cd -= dt;
        if (e.cd <= 0 && absDist < 540) {
          e.state = 'shake'; e.stateT = 0.55;
        }
      } else if (e.state === 'shake') {
        e.stateT -= dt;
        if (e.stateT <= 0) {
          e.state = 'spray_low'; e.stateT = 0.75; SFX.spray();
        }
      } else if (e.state === 'spray_low') {
        e.stateT -= dt;
        if (Math.random() < 0.45) {
          spawnParticles(e.x + (e.facing>0?e.w:0), e.y + 52, ['#a855f7','#22c55e','#ec4899'][Math.floor(Math.random()*3)], 1, 55);
        }
        if (e.stateT <= 0) {
          e.state = 'spray_high'; e.stateT = 0.75; SFX.spray();
          if (W1.graffitis.length < 36) {
            W1.graffitis.push({
              x: e.x + (e.facing > 0 ? 22 : -46), y: GROUND_Y - 125 - Math.random()*30,
              tagIdx: Math.floor(Math.random() * 4),
              color: ['#d946ef', '#4ade80', '#38bdf8', '#facc15'][Math.floor(Math.random()*4)]
            });
          }
        }
      } else if (e.state === 'spray_high') {
        e.stateT -= dt;
        if (Math.random() < 0.45) {
          spawnParticles(e.x + (e.facing>0?e.w:0), e.y + 24, ['#a855f7','#22c55e','#38bdf8'][Math.floor(Math.random()*3)], 1, 60);
        }
        if (e.stateT <= 0) {
          e.state = 'walk';
          e.cd = hard ? 2.2 : 3.2;
        }
      }
    } else if (e.type === 'nero') {
      // Urban pickpocket: patrols & lunges with outstretched hands when Brayan gets close!
      if (e.state === 'lunge') {
        e.x += e.facing * (hard ? 228 : 172) * dt;
        e.x = Math.max(e.minX - 40, Math.min(e.maxX + 40, e.x));
        e.stateT -= dt;
        if (e.stateT <= 0) {
          e.state = 'walk';
          e.cd = hard ? 1.15 : 1.85;
        }
      } else {
        e.x += e.vx * dt;
        if (e.x < e.minX) { e.x = e.minX; e.vx = Math.abs(e.vx); }
        if (e.x > e.maxX) { e.x = e.maxX; e.vx = -Math.abs(e.vx); }
        e.facing = e.vx >= 0 ? 1 : -1;
        e.cd = Math.max(0, e.cd - dt);
        if (e.cd <= 0 && absDist < 225 && Math.abs(P.y - e.y) < 90) {
          e.facing = dist >= 0 ? 1 : -1;
          e.state = 'lunge';
          e.stateT = 0.56;
          addFloatText(e.x + 20, e.y - 12, t().neroShout, '#38bdf8');
        }
      }
    }

    // Player <-> Enemy Collision (Stomp vs Hurt)
    const hitPad = 8;
    if (P.x + P.w - hitPad > e.x + hitPad && P.x + hitPad < e.x + e.w - hitPad &&
        P.y + P.h > e.y + 6 && P.y < e.y + e.h) {
      if (P.vy > 40 && (P.y + P.h - P.vy * dt) <= e.y + 34) {
        e.alive = false;
        P.vy = -420;
        W1.score += 150;
        W1.stompedCount++;
        SFX.stomp();
        addFloatText(e.x + 20, e.y, '+150', '#4ade80');
        spawnParticles(e.x + e.w/2, e.y + 30, '#facc15', 10, 160);
      } else {
        damagePlayer(e.type === 'nero' ? 'nero' : 'enemy');
      }
    }
  }

  // Update Projectiles (thrown protest posters)
  for (let i = W1.projectiles.length - 1; i >= 0; i--) {
    const pr = W1.projectiles[i];
    pr.x += pr.vx * dt;
    pr.y += pr.vy * dt;
    pr.vy += 210 * dt;
    pr.rot += 7.5 * dt;
    pr.life -= dt;
    if (pr.y > GROUND_Y || pr.life <= 0) {
      W1.projectiles.splice(i, 1); continue;
    }
    if (P.x + P.w - 6 > pr.x - 16 && P.x + 6 < pr.x + 16 &&
        P.y + P.h - 6 > pr.y - 16 && P.y + 6 < pr.y + 16) {
      W1.projectiles.splice(i, 1);
      damagePlayer('poster');
    }
  }

  // Update La Señora de la Chaza (Allied NPC)
  for (const ch of W1.chazas) {
    if (ch.bubbleT > 0) ch.bubbleT = Math.max(0, ch.bubbleT - dt);
    const dist = Math.abs((P.x + P.w/2) - (ch.x + 48));
    if (dist < 92) {
      ch.smileT = 0.5;
      if (!ch.given) {
        ch.given = true;
        ch.bubbleT = 3.2;
        const healAmt = hard ? 1 : 2;
        const gained = Math.min(P.maxHp - P.hp, healAmt);
        P.hp = Math.min(P.maxHp, P.hp + healAmt);
        W1.chicletCount++;
        W1.score += 200;
        SFX.heal();
        addFloatText(ch.x + 42, ch.y - 12, gained > 0 ? `CHICLETS +${gained} ♥` : 'CHICLETS +200', '#4ade80');
        spawnParticles(ch.x + 48, ch.y + 30, '#fde047', 12, 140);
      }
    } else if (ch.smileT > 0) {
      ch.smileT = Math.max(0, ch.smileT - dt);
    }
  }

  // Collectibles (Hojas de Vida & Tintos)
  for (const it of W1.items) {
    if (it.got) continue;
    if (P.x + P.w > it.x - 14 && P.x < it.x + 14 && P.y + P.h > it.y - 16 && P.y < it.y + 16) {
      it.got = true;
      if (it.type === 'cv') {
        W1.cvCount++; W1.score += 100; SFX.collect();
        addFloatText(it.x, it.y - 10, '+100 CV', '#38bdf8');
      } else {
        W1.score += 250;
        if (P.hp < P.maxHp) { P.hp++; addFloatText(it.x, it.y - 10, 'TINTO +1 ♥', '#fb923c'); }
        else addFloatText(it.x, it.y - 10, 'TINTO +250', '#fb923c');
        SFX.heal();
      }
      spawnParticles(it.x, it.y, '#facc15', 7, 110);
    }
  }

  // Particles & Floating Texts
  for (let i = W1.particles.length - 1; i >= 0; i--) {
    const pt = W1.particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 320 * dt; pt.life -= dt;
    if (pt.life <= 0) W1.particles.splice(i, 1);
  }
  for (let i = W1.floatTexts.length - 1; i >= 0; i--) {
    const ft = W1.floatTexts[i];
    ft.y -= 34 * dt; ft.life -= dt;
    if (ft.life <= 0) W1.floatTexts.splice(i, 1);
  }

  // Reach Goal (Plaza de Bolívar)
  if (P.x + P.w >= GOAL_X) {
    W1.status = 'VICTORY';
    W1.score += (hard ? 1000 : 500) + P.hp * 150;
    SFX.victory();
    showOverlay('VICTORY');
  }
}

// =========================================================================
// GROUND SHADOW HELPER
// =========================================================================
function drawGroundShadow(cx, cy, rx, ry) {
  ctx.save();
  ctx.fillStyle = 'rgba(10, 8, 22, 0.42)';
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// =========================================================================
// RENDER WORLD 1-1 (16-BIT BOGOTÁ CARRERA 7ª WITH REAL 16-BIT SPRITES!)
// =========================================================================
function renderWorld1_1() {
  const L = t();
  const cam = W1.camX;

  ctx.save();
  if (W1.shakeTime > 0) {
    const m = W1.shakeTime * 14;
    ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m);
  }

  // 1. Sunset Andean Sky Gradient
  const sky = ctx.createLinearGradient(0, 0, 0, 340);
  sky.addColorStop(0, '#1e1b4b');
  sky.addColorStop(0.45, '#581c87');
  sky.addColorStop(0.78, '#c2410c');
  sky.addColorStop(1, '#fb923c');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 960, 540);

  // Twinkling stars
  ctx.fillStyle = '#fef08a';
  for (let i = 0; i < 24; i++) {
    const sx = ((i * 97 - cam * 0.04) % 960 + 960) % 960;
    const sy = 18 + (i * 31) % 115;
    if ((Math.floor(W1.time * 2 + i) % 3) !== 0) ctx.fillRect(sx, sy, 3, 3);
  }

  // 2. Parallax Layer 1: Cerros Orientales + Monserrate + Teleférico + Torre Colpatria
  const mOff = -(cam * 0.14) % 960;
  for (let rep = -1; rep <= 1; rep++) {
    const ox = mOff + rep * 960;
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.moveTo(ox, 360); ctx.lineTo(ox+140, 210); ctx.lineTo(ox+260, 145);
    ctx.lineTo(ox+440, 250); ctx.lineTo(ox+640, 185); ctx.lineTo(ox+820, 230); ctx.lineTo(ox+960, 360);
    ctx.closePath(); ctx.fill();

    // Monserrate Sanctuary illuminated on peak
    ctx.fillStyle = '#fef08a'; ctx.fillRect(ox + 248, 127, 24, 18);
    ctx.fillStyle = '#fff'; ctx.fillRect(ox + 256, 114, 7, 14);
    ctx.fillStyle = '#facc15'; ctx.fillRect(ox + 258, 108, 3, 7);

    // Teleférico cable + moving cabin
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ox + 266, 136); ctx.lineTo(ox + 560, 260); ctx.stroke();
    const cabT = (W1.time * 0.12 + 0.3) % 1;
    const cx = ox + 266 + (560 - 266) * cabT, cy = 136 + (260 - 136) * cabT;
    ctx.fillStyle = '#ef4444'; ctx.fillRect(cx - 7, cy + 4, 14, 10);
    ctx.fillStyle = '#fef08a'; ctx.fillRect(cx - 4, cy + 6, 8, 4);

    // Torre Colpatria with animated Colombia tricolor lights
    const tx = ox + 690;
    ctx.fillStyle = '#0f172a'; ctx.fillRect(tx, 102, 44, 240);
    const shift = Math.floor(W1.time * 4);
    for (let r = 0; r < 18; r++) {
      const ci = (r + shift) % 3;
      ctx.fillStyle = ci === 0 ? '#facc15' : (ci === 1 ? '#2563eb' : '#ef4444');
      ctx.fillRect(tx + 4, 110 + r * 11, 36, 4);
    }
  }

  // 3. Parallax Layer 2: Bogotá Brick Skyline
  const bOff = -(cam * 0.38) % 640;
  for (let rep = -1; rep <= 2; rep++) {
    const bx = bOff + rep * 640;
    const bldgs = [
      { x: 0, w: 120, h: 190, c: '#7c2d12' },
      { x: 128, w: 145, h: 150, c: '#9a3412' },
      { x: 280, w: 110, h: 215, c: '#7f1d1d' },
      { x: 398, w: 135, h: 165, c: '#92400e' },
      { x: 540, w: 94, h: 185, c: '#7c2d12' }
    ];
    for (const b of bldgs) {
      const by = 372 - b.h;
      ctx.fillStyle = '#1c1917'; ctx.fillRect(bx + b.x - 2, by - 2, b.w + 4, b.h + 4);
      ctx.fillStyle = b.c; ctx.fillRect(bx + b.x, by, b.w, b.h);
      ctx.fillStyle = '#fde68a';
      for (let wx = 12; wx < b.w - 18; wx += 22) {
        for (let wy = 16; wy < b.h - 28; wy += 26) {
          if (((wx + wy + b.x) % 5) !== 0) ctx.fillRect(bx + b.x + wx, by + wy, 10, 14);
        }
      }
    }
  }

  // 4. Background Avenue (with passing TransMilenio & yellow taxis!)
  ctx.fillStyle = '#334155'; ctx.fillRect(0, 355, 960, 48);
  ctx.fillStyle = '#facc15';
  for (let x = -((cam*0.65)%64); x < 960; x += 64) ctx.fillRect(x, 378, 32, 4);

  for (const c of W1.bgCars) {
    const sx = c.x - cam * 0.65;
    if (sx < -260 || sx > 1100) continue;
    if (c.type === 'transmi') {
      ctx.fillStyle = '#b91c1c'; ctx.fillRect(sx, 326, 175, 42);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(sx + 82, 328, 12, 38);
      ctx.fillStyle = '#fef08a';
      for (let w = 0; w < 6; w++) ctx.fillRect(sx + 8 + w*26 + (w>=3?10:0), 334, 18, 14);
      ctx.fillStyle = '#000'; ctx.fillRect(sx + 20, 365, 16, 8); ctx.fillRect(sx + 135, 365, 16, 8);
    } else {
      ctx.fillStyle = '#facc15'; ctx.fillRect(sx, 348, 62, 22);
      ctx.fillRect(sx + 12, 338, 36, 12);
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(sx + 16, 340, 28, 8);
      ctx.fillStyle = '#000'; ctx.fillRect(sx + 8, 367, 12, 7); ctx.fillRect(sx + 42, 367, 12, 7);
    }
  }

  // 5. WORLD SPACE OBJECTS (translate by -cam)
  ctx.save();
  ctx.translate(-Math.round(cam), 0);

  // Foreground Bogotá brick wall sections (canvas for persistent graffiti!)
  for (let wx = 0; wx < LEVEL_LEN; wx += 420) {
    if (wx + 240 < cam || wx > cam + 960) continue;
    ctx.fillStyle = '#5c2416'; ctx.fillRect(wx, 290, 240, GROUND_Y - 290);
    ctx.strokeStyle = '#3b150c'; ctx.lineWidth = 2;
    for (let ry = 290; ry < GROUND_Y; ry += 18) {
      ctx.beginPath(); ctx.moveTo(wx, ry); ctx.lineTo(wx + 240, ry); ctx.stroke();
    }
    ctx.fillStyle = '#292524'; ctx.fillRect(wx - 2, 286, 244, 6);
  }

  // Persistent painted graffiti on the brick walls!
  for (const gr of W1.graffitis) {
    if (gr.x + 120 < cam || gr.x - 40 > cam + 960) continue;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(gr.x - 4, gr.y - 14, 92, 22);
    ctx.font = 'bold 9px "Press Start 2P", monospace';
    ctx.fillStyle = gr.color;
    ctx.textAlign = 'left';
    ctx.fillText(L.graffitiTags[gr.tagIdx % L.graffitiTags.length], gr.x, gr.y);
    ctx.restore();
  }

  // Carrera 7ª Paved Brick Sidewalk
  ctx.fillStyle = '#292524'; ctx.fillRect(cam - 20, GROUND_Y, 1000, 90);
  ctx.fillStyle = '#9a3412';
  const startTile = Math.floor(cam / 48) * 48;
  for (let x = startTile; x < cam + 1000; x += 48) {
    ctx.fillRect(x + 2, GROUND_Y + 6, 44, 18);
    ctx.fillRect(x - 18, GROUND_Y + 28, 44, 18);
    ctx.fillRect(x + 2, GROUND_Y + 50, 44, 18);
  }
  ctx.fillStyle = '#facc15'; ctx.fillRect(cam - 20, GROUND_Y, 1000, 4);

  // Platforms
  for (const pl of W1.platforms) {
    if (pl.x + pl.w < cam - 40 || pl.x > cam + 1000) continue;
    ctx.fillStyle = '#000'; ctx.fillRect(pl.x - 2, pl.y - 2, pl.w + 4, pl.h + 4);
    if (pl.style === 'sitp') {
      ctx.fillStyle = '#2563eb'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
      ctx.fillStyle = '#facc15'; ctx.fillRect(pl.x, pl.y, pl.w, 5);
      ctx.fillStyle = '#fff'; ctx.font = '7px "Press Start 2P", monospace'; ctx.textAlign = 'center';
      ctx.fillText('SITP', pl.x + pl.w/2, pl.y + 16);
    } else if (pl.style === 'awning') {
      for (let sx = 0; sx < pl.w; sx += 16) {
        ctx.fillStyle = (sx/16)%2===0 ? '#dc2626' : '#f8fafc';
        ctx.fillRect(pl.x + sx, pl.y, Math.min(16, pl.w - sx), pl.h);
      }
    } else if (pl.style === 'balcony') {
      ctx.fillStyle = '#78350f'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
      ctx.fillStyle = '#fbbf24'; ctx.fillRect(pl.x, pl.y, pl.w, 4);
    } else {
      ctx.fillStyle = '#b45309'; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
      ctx.strokeStyle = '#451a03'; ctx.lineWidth = 2; ctx.strokeRect(pl.x+2, pl.y+2, pl.w-4, pl.h-4);
    }
  }

  // Goal Archway: META 1-1 — PLAZA DE BOLÍVAR
  if (GOAL_X > cam - 160 && GOAL_X < cam + 1100) {
    ctx.fillStyle = '#1e293b'; ctx.fillRect(GOAL_X, 230, 14, GROUND_Y - 230);
    ctx.fillRect(GOAL_X + 120, 230, 14, GROUND_Y - 230);
    ctx.fillStyle = '#facc15'; ctx.fillRect(GOAL_X - 10, 200, 154, 42);
    ctx.fillStyle = '#1e1b4b'; ctx.fillRect(GOAL_X - 6, 204, 146, 34);
    ctx.fillStyle = '#facc15'; ctx.font = 'bold 10px "Press Start 2P", monospace'; ctx.textAlign = 'center';
    ctx.fillText(L.goalLabel, GOAL_X + 67, 220);
    ctx.fillStyle = '#38bdf8'; ctx.font = '7px "Press Start 2P", monospace';
    ctx.fillText(L.plazaLabel, GOAL_X + 67, 233);
    const wave = Math.sin(W1.time * 6) * 3;
    ctx.fillStyle = '#FCD116'; ctx.fillRect(GOAL_X + 67, 162 + wave, 44, 12);
    ctx.fillStyle = '#003893'; ctx.fillRect(GOAL_X + 67, 174 + wave, 44, 6);
    ctx.fillStyle = '#CE1126'; ctx.fillRect(GOAL_X + 67, 180 + wave, 44, 6);
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(GOAL_X + 64, 158, 4, 44);
  }

  // Allied NPC: La Señora de la Chaza (REAL 16-BIT SPRITE!)
  for (const ch of W1.chazas) {
    if (ch.x + 140 < cam || ch.x - 100 > cam + 960) continue;
    const spr = IMGS.chaza_lady;
    if (spr) {
      const sh = 122, sw = spr.width * (sh / spr.height);
      const dx = ch.x, dy = GROUND_Y - sh + 4;
      drawGroundShadow(dx + sw * 0.5, GROUND_Y + 3, sw * 0.48, 8);
      ctx.drawImage(spr, dx, dy, sw, sh);
      if (ch.bubbleT > 0) {
        const msg = ch.bubbleT > 1.2 ? L.chazaGreet : L.chazaThanks;
        ctx.save();
        ctx.font = '8px "Press Start 2P", monospace';
        const tw = Math.max(120, ctx.measureText(msg).width + 18);
        const gx = dx + sw * 0.5, bx = gx - tw / 2, by = dy - 30;
        ctx.fillStyle = '#fff'; ctx.fillRect(bx, by, tw, 24);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeRect(bx, by, tw, 24);
        ctx.fillStyle = '#111'; ctx.textAlign = 'center';
        ctx.fillText(msg, gx, by + 16);
        ctx.restore();
      }
    }
  }

  // Collectibles (Hojas de Vida & Tintos)
  for (const it of W1.items) {
    if (it.got || it.x < cam - 30 || it.x > cam + 990) continue;
    const bob = Math.sin(W1.time * 4.5 + it.x * 0.02) * 5;
    if (it.type === 'cv') {
      ctx.fillStyle = '#000'; ctx.fillRect(it.x - 11, it.y - 14 + bob, 22, 26);
      ctx.fillStyle = '#fef3c7'; ctx.fillRect(it.x - 9, it.y - 12 + bob, 18, 22);
      ctx.fillStyle = '#2563eb'; ctx.fillRect(it.x - 6, it.y - 7 + bob, 12, 3);
      ctx.fillStyle = '#64748b'; ctx.fillRect(it.x - 6, it.y - 1 + bob, 10, 2);
      ctx.fillRect(it.x - 6, it.y + 4 + bob, 12, 2);
    } else {
      ctx.fillStyle = '#000'; ctx.fillRect(it.x - 10, it.y - 8 + bob, 20, 20);
      ctx.fillStyle = '#f8fafc'; ctx.fillRect(it.x - 8, it.y - 6 + bob, 16, 16);
      ctx.fillStyle = '#451a03'; ctx.fillRect(it.x - 7, it.y - 5 + bob, 14, 5);
      ctx.fillStyle = '#cbd5e1'; ctx.fillRect(it.x - 4, it.y - 13 + bob, 2, 5); ctx.fillRect(it.x + 2, it.y - 15 + bob, 2, 6);
    }
  }

  // Enemies (ALL REAL 16-BIT PNG SPRITES!)
  for (const e of W1.enemies) {
    if (!e.alive || e.x + e.w < cam - 100 || e.x > cam + 1060) continue;
    let spr = null;
    let targetH = 104;
    let yBob = 0;

    if (e.type === 'nero') {
      spr = (e.state === 'lunge') ? IMGS.nero_lunge : IMGS.nero_walk;
      targetH = (e.state === 'lunge') ? 100 : 106;
      yBob = (e.state === 'lunge') ? 0 : Math.abs(Math.sin(e.animT * 9)) * -4;
    } else if (e.type === 'cartelera') {
      if (e.state === 'throw') spr = IMGS.act_throw;
      else spr = Math.floor(e.animT * 5) % 2 === 0 ? IMGS.act_walk1 : IMGS.act_walk2;
      targetH = 106;
    } else {
      if (e.state === 'shake') spr = Math.floor(e.animT * 14) % 2 === 0 ? IMGS.act_spray_high : IMGS.act_spray_low;
      else if (e.state === 'spray_low') spr = IMGS.act_spray_low;
      else if (e.state === 'spray_high') spr = IMGS.act_spray_high;
      else spr = Math.floor(e.animT * 5) % 2 === 0 ? IMGS.act_walk1 : IMGS.act_walk2;
      targetH = (e.state === 'spray_low' || e.state === 'spray_high') ? 96 : 104;
    }

    if (spr && spr.height > 0) {
      const sw = spr.width * (targetH / spr.height);
      const dx = e.x + e.w/2 - sw/2;
      const dy = GROUND_Y - targetH + 2 + yBob;
      drawGroundShadow(e.x + e.w/2, GROUND_Y + 2, e.state === 'lunge' ? 32 : 24, 6);
      ctx.save();
      if (e.facing < 0) {
        ctx.translate(dx + sw, dy); ctx.scale(-1, 1);
        ctx.drawImage(spr, 0, 0, sw, targetH);
      } else {
        ctx.drawImage(spr, dx, dy, sw, targetH);
      }
      ctx.restore();
    }
  }

  // Thrown Protest Signs (4 satirical motifs!)
  for (const pr of W1.projectiles) {
    ctx.save();
    ctx.translate(pr.x, pr.y);
    ctx.rotate(pr.rot);
    const cols = ['#ec4899', '#a855f7', '#22c55e', '#facc15'];
    ctx.fillStyle = '#000'; ctx.fillRect(-19, -14, 38, 28);
    ctx.fillStyle = '#fef3c7'; ctx.fillRect(-17, -12, 34, 24);
    ctx.fillStyle = cols[pr.motif % 4]; ctx.fillRect(-17, -12, 34, 7);
    ctx.fillStyle = '#111'; ctx.font = 'bold 5px "Press Start 2P", monospace'; ctx.textAlign = 'center';
    ctx.fillText(L.signMotifs[pr.motif % 4], 0, 7);
    ctx.restore();
  }

  // Player: Brayan 16-Bit (REAL 16-BIT PNG SPRITES!)
  const P = W1.player;
  if (P.invuln <= 0 || Math.floor(W1.time * 18) % 2 === 0) {
    let bSpr = IMGS.brayan_idle;
    if (!P.onGround) bSpr = IMGS.brayan_walk2;
    else if (P.vx !== 0) bSpr = P.walkFrame === 0 ? IMGS.brayan_walk1 : IMGS.brayan_walk2;
    if (bSpr && bSpr.height > 0) {
      const bh = 102, bw = bSpr.width * (bh / bSpr.height);
      const bx = P.x + P.w/2 - bw/2, by = P.y + P.h - bh + 2;
      if (P.onGround) drawGroundShadow(P.x + P.w/2, P.y + P.h + 2, 22, 6);
      ctx.save();
      if (P.facing < 0) {
        ctx.translate(bx + bw, by); ctx.scale(-1, 1);
        ctx.drawImage(bSpr, 0, 0, bw, bh);
      } else {
        ctx.drawImage(bSpr, bx, by, bw, bh);
      }
      ctx.restore();
    }
  }

  // Particles & Floating Texts
  for (const pt of W1.particles) {
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
  }
  ctx.font = 'bold 10px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  for (const ft of W1.floatTexts) {
    ctx.fillStyle = '#000'; ctx.fillText(ft.text, ft.x + 2, ft.y + 2);
    ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
  }

  ctx.restore(); // end world space

  // 6. SNES HUD BAR
  ctx.fillStyle = 'rgba(10, 8, 24, 0.88)'; ctx.fillRect(0, 0, 960, 56);
  ctx.fillStyle = '#facc15'; ctx.fillRect(0, 54, 960, 3);

  ctx.font = '12px "Press Start 2P", monospace';
  ctx.textAlign = 'left'; ctx.fillStyle = '#facc15';
  ctx.fillText('BRAYAN', 16, 23);
  let hearts = '';
  for (let i = 0; i < P.maxHp; i++) hearts += (i < P.hp ? '♥ ' : '♡ ');
  ctx.fillStyle = '#ef4444'; ctx.fillText(hearts, 16, 45);

  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText(`${L.worldHud} [${STATE.mode === 'light' ? L.modeBadgeLight : L.modeBadgeHeavy}]`, 480, 22);
  const prog = Math.max(0, Math.min(1, P.x / GOAL_X));
  ctx.fillStyle = '#1e293b'; ctx.fillRect(340, 32, 280, 12);
  ctx.fillStyle = '#22c55e'; ctx.fillRect(342, 34, Math.floor(276 * prog), 8);
  ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.strokeRect(340, 32, 280, 12);

  ctx.textAlign = 'right'; ctx.fillStyle = '#38bdf8';
  ctx.fillText(`${L.statScore} ${String(W1.score).padStart(6, '0')}`, 944, 24);
  ctx.fillStyle = '#fef08a'; ctx.font = '10px "Press Start 2P", monospace';
  ctx.fillText(`CV:${W1.cvCount} CHIC:${W1.chicletCount}`, 944, 45);

  if (W1.fadeIn > 0) {
    ctx.fillStyle = `rgba(18, 12, 46, ${W1.fadeIn})`;
    ctx.fillRect(0, 0, 960, 540);
  }
  ctx.restore();
}

// =========================================================================
// CUTSCENE RENDER & UPDATE (REAL 16-BIT LOBBY + CAST SPRITES!)
// =========================================================================
function updateCutscene(dt) {
  CUT.totalTime += dt; CUT.beatTime += dt;
  const fullText = t().beats[CUT.beat].text;
  if (!CUT.fullyTyped) {
    CUT.charAccum += dt * 40;
    const nextCount = Math.floor(CUT.charAccum);
    if (nextCount > CUT.typedChars) {
      CUT.typedChars = Math.min(nextCount, fullText.length);
      elDlgText.textContent = fullText.slice(0, CUT.typedChars);
      if (CUT.typedChars % 3 === 0) SFX.type();
      if (CUT.typedChars >= fullText.length) CUT.fullyTyped = true;
    }
  } else {
    CUT.autoAdvanceTimer += dt;
    if (CUT.autoAdvanceTimer >= (CUT.beat === 4 ? 3.0 : 3.6)) {
      if (CUT.beat < t().beats.length - 1) setupBeat(CUT.beat + 1);
      else enterWorld1_1();
    }
  }
  if (CUT.beat === 0) {
    if (CUT.brayanX < 250) { CUT.brayanX += 72*dt; CUT.brayanState = 'walk'; CUT.walkTimer += dt; if (CUT.walkTimer > 0.22) { CUT.walkTimer = 0; CUT.walkFrame = 1-CUT.walkFrame; SFX.step(); } }
    else CUT.brayanState = 'idle';
  } else if (CUT.beat === 1) {
    if (CUT.brayanX < 320) { CUT.brayanX += 38*dt; CUT.brayanState = 'walk'; CUT.walkTimer += dt; if (CUT.walkTimer > 0.28) { CUT.walkTimer = 0; CUT.walkFrame = 1-CUT.walkFrame; } }
    else CUT.brayanState = 'idle';
  } else if (CUT.beat === 2) {
    if (CUT.brayanX < 415) { CUT.brayanX += 58*dt; CUT.brayanState = 'walk'; CUT.walkTimer += dt; if (CUT.walkTimer > 0.22) { CUT.walkTimer = 0; CUT.walkFrame = 1-CUT.walkFrame; SFX.step(); } }
  } else if (CUT.beat === 3) {
    CUT.tripProgress += dt;
    if (CUT.tripProgress < 0.72) { CUT.brayanState = 'trip'; CUT.brayanX += 95*dt; }
    else CUT.brayanState = 'ko';
  } else if (CUT.beat === 4) {
    CUT.brayanState = 'ko'; CUT.fogAlpha = Math.min(0.92, CUT.fogAlpha + dt * 0.34);
  }
  if (CUT.shakeTime > 0) CUT.shakeTime = Math.max(0, CUT.shakeTime - dt);
  if (CUT.flashAlpha > 0) CUT.flashAlpha = Math.max(0, CUT.flashAlpha - dt * 2.2);
  CUT.papers.forEach((p) => {
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 320*dt; p.vx *= 0.99; p.rot += p.vrot*dt;
    if (p.y > 465) { p.y = 465; p.vy = 0; p.vx *= 0.7; p.vrot = 0; }
  });
}

function renderCutscene() {
  ctx.save();
  if (CUT.shakeTime > 0) { const m = CUT.shakeTime * 18; ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m); }
  if (IMGS.lobby) ctx.drawImage(IMGS.lobby, 0, 0, 960, 540);
  const floorY = 472;

  ctx.save();
  ctx.strokeStyle = '#111827'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(415, 466); ctx.bezierCurveTo(475, 456, 520, 478, 585, 468); ctx.bezierCurveTo(625, 462, 650, 456, 685, 454); ctx.stroke();
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ef4444'; ctx.fillRect(408, 462, 9, 7);
  ctx.restore();

  const bob = Math.sin(CUT.totalTime * 5) * 1.5;
  if (IMGS.cameraman && IMGS.cameraman.height > 0) {
    const ch = 192, cw = IMGS.cameraman.width * (ch / IMGS.cameraman.height);
    const camX = 635, camY = floorY - ch + 4;
    drawGroundShadow(camX+cw*0.5, floorY+2, 40, 9);
    ctx.save(); ctx.translate(camX+cw, camY); ctx.scale(-1, 1); ctx.drawImage(IMGS.cameraman, 0, 0, cw, ch); ctx.restore();
    if (Math.floor(CUT.totalTime*2.5)%2===0) { ctx.fillStyle='#ef4444'; ctx.fillRect(camX+cw-28, camY+34, 6, 6); }
  }
  if (IMGS.reporter && IMGS.reporter.height > 0) {
    const rh = 190, rw = IMGS.reporter.width * (rh / IMGS.reporter.height);
    drawGroundShadow(724+rw*0.5, floorY+2, 34, 8);
    ctx.drawImage(IMGS.reporter, 724, floorY-rh+4+(CUT.beat===1?bob*0.6:0), rw, rh);
  }
  const majoTalk = (CUT.beat===1||CUT.beat===2) ? (Math.floor(CUT.totalTime*2.4)%2===0) : (Math.floor(CUT.totalTime*1.2)%2===0);
  const mImg = majoTalk ? IMGS.majo_talk : IMGS.majo_smile;
  if (mImg && mImg.height > 0) {
    const mh = 194, mw = mImg.width * (mh / mImg.height);
    drawGroundShadow(865, floorY+2, 38, 9);
    ctx.drawImage(mImg, 865-mw/2, floorY-mh+4+(majoTalk?-Math.abs(bob):0), mw, mh);
  }

  let bImg = IMGS.brayan_idle, byOff = 0, targetBH = 190;
  if (CUT.brayanState === 'walk') { bImg = CUT.walkFrame===0 ? IMGS.brayan_walk1 : IMGS.brayan_walk2; byOff = CUT.walkFrame===0 ? -2 : 0; }
  else if (CUT.brayanState === 'trip') { bImg = IMGS.brayan_trip; targetBH = 175; byOff = -12 + Math.sin(CUT.tripProgress*Math.PI)*-18; }
  else if (CUT.brayanState === 'ko') { bImg = IMGS.brayan_ko; targetBH = 88; byOff = 8; }
  if (bImg && bImg.height > 0) {
    const bh = targetBH, bw = bImg.width * (bh / bImg.height), by = floorY-bh+byOff;
    drawGroundShadow(CUT.brayanX+bw*0.5, floorY+4, CUT.brayanState==='ko'?78:34, 9);
    ctx.drawImage(bImg, CUT.brayanX, by, bw, bh);
    if (CUT.brayanState === 'ko') {
      for (let i = 0; i < 3; i++) {
        const ang = CUT.totalTime*4 + i*2.09;
        ctx.fillStyle='#fde047'; ctx.fillRect(CUT.brayanX+bw*0.82+Math.cos(ang)*24-3, by+8+Math.sin(ang)*9-3, 6, 6);
      }
    }
  }

  CUT.papers.forEach((p) => {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle='#f8fafc'; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.strokeStyle='#1e293b'; ctx.lineWidth=2; ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });

  const bannerW = 305, bannerX = 960 - bannerW, bannerY = 468;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.92)'; ctx.fillRect(bannerX, bannerY-30, bannerW, 28);
  ctx.fillStyle = '#facc15'; ctx.fillRect(bannerX, bannerY-30, bannerW, 3);
  ctx.font = 'bold 12px "Press Start 2P", monospace'; ctx.fillStyle = '#fff'; ctx.textAlign = 'right';
  ctx.fillText('MAJO PIZA ROMERO', 948, bannerY-10);
  ctx.fillStyle = '#b91c1c'; ctx.beginPath(); ctx.moveTo(bannerX-18, bannerY+34); ctx.lineTo(bannerX, bannerY); ctx.lineTo(960, bannerY); ctx.lineTo(960, bannerY+34); ctx.closePath(); ctx.fill();
  if (Math.floor(CUT.totalTime*2)%2===0) { ctx.fillStyle='#fff'; ctx.fillRect(bannerX+12, bannerY+11, 10, 10); }
  ctx.font = 'bold 13px "Press Start 2P", monospace'; ctx.fillStyle = '#fff'; ctx.fillText(t().tvLive, 948, bannerY+23);

  if (CUT.flashAlpha > 0) { ctx.fillStyle = `rgba(255,255,255,${CUT.flashAlpha})`; ctx.fillRect(0,0,960,540); }
  if (CUT.fogAlpha > 0) {
    const grad = ctx.createRadialGradient(480,270,60,480,270,560);
    grad.addColorStop(0, `rgba(124,58,237,${CUT.fogAlpha*0.65})`);
    grad.addColorStop(1, `rgba(15,10,42,${CUT.fogAlpha})`);
    ctx.fillStyle = grad; ctx.fillRect(0,0,960,540);
  }
  ctx.restore();
}

// =========================================================================
// MAIN LOOP
// =========================================================================
let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (assetsLoaded) {
    if (STATE.screen === 'INTRO_CUTSCENE') { updateCutscene(dt); renderCutscene(); }
    else if (STATE.screen === 'WORLD_1_1') { updateWorld1_1(dt); renderWorld1_1(); }
  }
  requestAnimationFrame(gameLoop);
}

// =========================================================================
// INPUTS (PC + MOBILE)
// =========================================================================
document.getElementById('btn-es').addEventListener('click', () => { STATE.lang = 'es'; SFX.blip(); applyLocalization(); });
document.getElementById('btn-en').addEventListener('click', () => { STATE.lang = 'en'; SFX.blip(); applyLocalization(); });
document.getElementById('btn-sfx').addEventListener('click', (e) => {
  const on = SFX.toggle();
  e.currentTarget.textContent = on ? 'SFX: ON' : 'SFX: OFF';
  e.currentTarget.classList.toggle('muted', !on);
});
document.getElementById('card-light').addEventListener('click', () => selectMode('light'));
document.getElementById('card-heavy').addEventListener('click', () => selectMode('heavy'));
document.getElementById('btn-play').addEventListener('click', () => { SFX.start(); transitionTo(startIntroCutscene); });
elDialogue.addEventListener('click', advanceCutscene);
elSkip.addEventListener('click', (e) => { e.stopPropagation(); enterWorld1_1(); });
document.getElementById('btn-replay-intro').addEventListener('click', () => { SFX.select(); transitionTo(startIntroCutscene); });
document.getElementById('btn-back-menu').addEventListener('click', backToMenu);
document.getElementById('ov-btn-menu').addEventListener('click', backToMenu);

document.getElementById('btn-pause').addEventListener('click', () => {
  if (W1.status !== 'PLAYING') return;
  W1.paused = !W1.paused; SFX.blip();
  if (W1.paused) showOverlay('PAUSE'); else hideOverlay();
  applyLocalization();
});

document.getElementById('ov-btn-primary').addEventListener('click', () => {
  SFX.select();
  if (elOverlay.dataset.kind === 'PAUSE') {
    W1.paused = false; hideOverlay(); applyLocalization();
  } else {
    buildWorld1_1();
  }
});

function bindHold(btnId, keyName, isJump=false) {
  const btn = document.getElementById(btnId);
  const on = (e) => {
    e.preventDefault();
    W1.keys[keyName] = true;
    if (isJump) { W1.keys.jumpHeld = true; W1.player.jumpBuffer = 0.14; }
    btn.classList.add('pressed');
  };
  const off = (e) => {
    e.preventDefault();
    W1.keys[keyName] = false;
    if (isJump) W1.keys.jumpHeld = false;
    btn.classList.remove('pressed');
  };
  btn.addEventListener('pointerdown', on); btn.addEventListener('pointerup', off);
  btn.addEventListener('pointerleave', off); btn.addEventListener('pointercancel', off);
}
bindHold('btn-left', 'left');
bindHold('btn-right', 'right');
bindHold('btn-jump', 'jump', true);

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'm') { document.getElementById('btn-sfx').click(); return; }
  if (k === 'l') { STATE.lang = STATE.lang === 'es' ? 'en' : 'es'; SFX.blip(); applyLocalization(); return; }

  if (STATE.screen === 'TITLE') {
    if (k === 'arrowleft' || k === 'a') selectMode('light');
    if (k === 'arrowright' || k === 'd') selectMode('heavy');
    if (k === 'enter' || k === ' ') { e.preventDefault(); document.getElementById('btn-play').click(); }
  } else if (STATE.screen === 'INTRO_CUTSCENE') {
    if (k === 'escape' || k === 's') enterWorld1_1();
    else if (k === ' ' || k === 'enter' || k === 'arrowright') { e.preventDefault(); advanceCutscene(); }
  } else if (STATE.screen === 'WORLD_1_1') {
    if (k === 'p' || k === 'escape') { document.getElementById('btn-pause').click(); return; }
    if (k === 'arrowleft' || k === 'a') W1.keys.left = true;
    if (k === 'arrowright' || k === 'd') W1.keys.right = true;
    if (k === ' ' || k === 'arrowup' || k === 'w') {
      e.preventDefault();
      if (!W1.keys.jumpHeld) W1.player.jumpBuffer = 0.14;
      W1.keys.jumpHeld = true;
    }
  }
});

window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') W1.keys.left = false;
  if (k === 'arrowright' || k === 'd') W1.keys.right = false;
  if (k === ' ' || k === 'arrowup' || k === 'w') W1.keys.jumpHeld = false;
});

// =========================================================================
// BOOTSTRAP
// =========================================================================
loadAllAssets().then(() => {
  document.getElementById('title-bg').style.backgroundImage = `url(${ASSET_DATA.lobby})`;
  document.getElementById('title-brayan-img').src = ASSET_DATA.brayan_idle;
  document.getElementById('title-nero-img').src = ASSET_DATA.nero_lunge;
  applyLocalization();
  requestAnimationFrame(gameLoop);
});
</script>
