<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BRAYAN 16 BIT — Mundo 1-1: Carrera 7ª (Bogotá)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
<div id="app">
  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand-mini">
      <span>BRAYAN 16 BIT</span>
      <span class="brand-badge">BOGOTÁ D.C.</span>
    </div>
    <div class="topbar-controls">
      <button id="btn-es" class="flag-btn active" aria-label="Español (Colombia)" title="Español (Colombia)">
        <svg class="flag-svg" viewBox="0 0 18 12" xmlns="http://www.w3.org/2000/svg">
          <rect width="18" height="6" y="0" fill="#FCD116"/>
          <rect width="18" height="3" y="6" fill="#003893"/>
          <rect width="18" height="3" y="9" fill="#CE1126"/>
        </svg><span>ES</span>
      </button>
      <button id="btn-en" class="flag-btn" aria-label="English (USA)" title="English (USA)">
        <svg class="flag-svg" viewBox="0 0 18 12" xmlns="http://www.w3.org/2000/svg">
          <rect width="18" height="12" fill="#FFF"/>
          <rect width="18" height="2" y="0" fill="#B22234"/>
          <rect width="18" height="2" y="4" fill="#B22234"/>
          <rect width="18" height="2" y="8" fill="#B22234"/>
          <rect width="18" height="1" y="11" fill="#B22234"/>
          <rect width="8" height="7" fill="#3C3B6E"/>
          <rect width="1" height="1" x="1" y="1" fill="#FFF"/>
          <rect width="1" height="1" x="4" y="1" fill="#FFF"/>
          <rect width="1" height="1" x="6" y="1" fill="#FFF"/>
          <rect width="1" height="1" x="2" y="3" fill="#FFF"/>
          <rect width="1" height="1" x="5" y="3" fill="#FFF"/>
          <rect width="1" height="1" x="1" y="5" fill="#FFF"/>
          <rect width="1" height="1" x="4" y="5" fill="#FFF"/>
          <rect width="1" height="1" x="6" y="5" fill="#FFF"/>
        </svg><span>EN</span>
      </button>
      <button id="btn-sfx" class="sfx-btn" aria-label="Sound">SFX: ON</button>
    </div>
  </header>

  <main class="stage-wrap">
    <!-- STAGE 0: TITLE SCREEN -->
    <section id="screen-title">
      <div id="title-bg" class="title-bg-layer"></div>
      <div class="title-scanlines"></div>
      <div class="title-content">
        <div class="hero-header">
          <img id="title-brayan-img" class="title-sprite-preview" alt="Brayan 16-bit" />
          <div class="title-logo-box">
            <h1 class="game-title">BRAYAN 16 BIT</h1>
            <div class="game-subtitle"><span id="t-subtitle">EDICIÓN BOGOTÁ • SÁTIRA 16-BIT</span></div>
          </div>
          <img id="title-nero-img" class="title-sprite-preview title-sprite-flip" alt="El Ñero 16-bit" />
        </div>
        <div class="mode-section">
          <p id="t-select-mode" class="mode-prompt">ELIGE TU MODO DE JUEGO:</p>
          <div class="mode-grid">
            <button id="card-light" class="mode-card selected" data-mode="light">
              <span id="t-light-tag" class="mode-tag light">DIFÍCIL</span>
              <h2 id="t-light-name" class="mode-name">MODO LIGERO</h2>
              <p id="t-light-desc" class="mode-desc">5 corazones. Chiclets de la chaza curan +2 ♥. Reto callejero bogotano.</p>
            </button>
            <button id="card-heavy" class="mode-card" data-mode="heavy">
              <span id="t-heavy-tag" class="mode-tag heavy">MUY DIFÍCIL</span>
              <h2 id="t-heavy-name" class="mode-name">MODO PESADO</h2>
              <p id="t-heavy-desc" class="mode-desc">3 corazones. Enemigos rápidos, chiclets solo +1 ♥. ¡Hora pico sin piedad!</p>
            </button>
          </div>
        </div>
        <div class="play-cta-wrap">
          <div class="stage-picker">
            <span id="t-stage-label" class="stage-picker-label">ETAPA DE INICIO:</span>
            <div class="stage-picker-btns">
              <button id="stage-pick-1-1" class="stage-pill active" data-stage="INTRO_CUTSCENE">1-1 CARRERA 7ª</button>
              <button id="stage-pick-1-2" class="stage-pill" data-stage="WORLD_1_2">1-2 TRANSMILENIO</button>
              <button id="stage-pick-1-3" class="stage-pill" data-stage="WORLD_1_3">1-3 PORTAL SUR</button>
              <button id="stage-pick-1-4" class="stage-pill" data-stage="WORLD_1_4">1-4 PIAMONTE</button>
            </div>
          </div>
          <button id="btn-play" class="btn-play">▶ JUGAR</button>
          <div id="t-controls-hint" class="controls-hint">PC: ←/→ MODO • ENTER JUGAR • L IDIOMA • M SONIDO</div>
        </div>
      </div>
    </section>

    <!-- STAGE 1+: CANVAS HOST (CUTSCENES & PLAYABLE WORLDS) -->
    <section id="screen-canvas-wrap">
      <div class="canvas-frame">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <button id="btn-skip" class="btn-skip">SKIP &gt;&gt;</button>
        <div id="game-overlay">
          <div class="overlay-box">
            <h2 id="ov-title" class="overlay-title">MUNDO 1-1 COMPLETADO</h2>
            <p id="ov-sub" class="overlay-sub"></p>
            <div id="ov-stats" class="overlay-stats"></div>
            <div class="overlay-btns">
              <button id="ov-btn-primary" class="btn-play" style="font-size:11px;padding:10px 18px;">↺ REINTENTAR</button>
              <button id="ov-btn-menu" class="btn-secondary" style="font-size:10px;padding:10px 14px;">⌂ MENÚ</button>
            </div>
          </div>
        </div>
      </div>

      <!-- SNES Dialogue Box (Cutscenes) -->
      <div id="dialogue-box" class="dialogue-box" role="button" tabindex="0">
        <div class="dialogue-header">
          <span id="dlg-speaker" class="dialogue-speaker">NARRADOR • BOGOTÁ D.C.</span>
          <span id="dlg-step" class="dialogue-step">1 / 5</span>
        </div>
        <div id="dlg-text" class="dialogue-text"></div>
        <div id="dlg-next" class="dialogue-next">▼ TOCA O PULSA ESPACIO</div>
      </div>

      <!-- World 1-1 Action Bar (PC + Mobile) -->
      <div id="world1-controls">
        <div class="dpad-group">
          <button id="btn-left" class="touch-btn" aria-label="Izquierda">◀</button>
          <button id="btn-right" class="touch-btn" aria-label="Derecha">▶</button>
          <button id="btn-jump" class="touch-btn jump-btn" aria-label="Saltar">SALTAR</button>
        </div>
        <div class="world1-actions">
          <button id="btn-pause" class="btn-secondary">❚❚ PAUSA</button>
          <button id="btn-replay-intro" class="btn-secondary hide-mobile">↺ INTRO</button>
          <button id="btn-back-menu" class="btn-secondary">⌂ MENÚ</button>
        </div>
      </div>

      <!-- World 1-2 TransMilenio Action Bar (PC + Mobile) -->
      <div id="world2-controls">
        <div class="dpad-group">
          <button id="btn-w2-left" class="touch-btn" aria-label="Esquivar Izquierda">◀</button>
          <button id="btn-w2-right" class="touch-btn" aria-label="Esquivar Derecha">▶</button>
          <button id="btn-w2-firm" class="touch-btn firm-btn" aria-label="Actitud Firme">💪 <span id="t-w2-firm">FIRME</span></button>
          <button id="btn-w2-window" class="touch-btn window-btn" aria-label="Abrir Ventana">🪟 <span id="t-w2-window">VENTANA</span></button>
        </div>
        <div class="world1-actions">
          <button id="btn-w2-pause" class="btn-secondary">❚❚ PAUSA</button>
          <button id="btn-w2-menu" class="btn-secondary">⌂ MENÚ</button>
        </div>
      </div>

      <!-- World 1-4 Piamonte Combat + Platforming Action Bar (PC + Mobile) -->
      <div id="world4-controls">
        <div class="dpad-group">
          <button id="btn-w4-left" class="touch-btn" aria-label="Izquierda">◀</button>
          <button id="btn-w4-right" class="touch-btn" aria-label="Derecha">▶</button>
          <button id="btn-w4-crouch" class="touch-btn crouch-btn" aria-label="Agacharse">▼</button>
          <button id="btn-w4-jump" class="touch-btn jump-btn" aria-label="Saltar">SALTAR</button>
          <button id="btn-w4-attack" class="touch-btn attack-btn" aria-label="Golpe Maletín">💼 <span id="t-w4-attack">MALETÍN</span></button>
        </div>
        <div class="world1-actions">
          <button id="btn-w4-pause" class="btn-secondary">❚❚ PAUSA</button>
          <button id="btn-w4-menu" class="btn-secondary">⌂ MENÚ</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="transition-curtain"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
